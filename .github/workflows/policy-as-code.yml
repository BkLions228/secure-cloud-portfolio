name: Policy as Code

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "backend/**"
      - "policy/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-validation:
    name: Security Policy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r policy/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Terraform format validation
        run: terraform fmt -check -recursive infrastructure

      - name: Terraform configuration validation
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false
          terraform validate
      - name: Install AWS SAM CLI
        run: |
          python -m venv .sam-venv
          .sam-venv/bin/python -m pip install --upgrade pip
          .sam-venv/bin/pip install aws-sam-cli==1.163.0

      - name: SAM template validation
        run: .sam-venv/bin/sam validate --template-file backend/template.yaml --lint

      - name: Python unit tests
        run: pytest backend/tests -v

      - name: Enforce Terraform security baseline
        run: |
          checkov \
            -d infrastructure \
            --framework terraform \
            --compact \
            --download-external-modules false \
            --check CKV_AWS_19,CKV_AWS_21,CKV_AWS_34,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56,CKV_AWS_63,CKV_AWS_86,CKV_AWS_274,CKV_AWS_358,CKV_AWS_393,CKV2_AWS_6,CKV2_AWS_46

      - name: Enforce SAM security baseline
        run: |
          checkov \
            -f backend/template.yaml \
            --framework cloudformation \
            --compact \
            --check CKV_AWS_28,CKV_AWS_45,CKV_AWS_66,CKV_AWS_95,CKV_AWS_363

      - name: Verify insecure configurations are blocked
        run: ./policy/tests/run-negative-tests.sh